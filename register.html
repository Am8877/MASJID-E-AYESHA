<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Registration - MASJID-E-AYESHA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.form-box{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.form-box h2{
    text-align:center;
    color:#0f766e;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#0f766e;
}

button{
    width:100%;
    padding:15px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:#0f766e;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.back{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🕌</div>

    <h1>MASJID-E-AYESHA</h1>

    <div class="form-box">

        <h2>📝 Member Registration</h2>

        <label>Member Name</label>

        <input
            type="text"
            id="name"
            placeholder="अपना पूरा नाम लिखें"
        >

        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            maxlength="10"
            inputmode="numeric"
            placeholder="10 digit mobile number"
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="अपना Email लिखें"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="कम से कम 6 characters"
        >

        <label>Monthly Hafiji Payment (₹)</label>

        <input
            type="number"
            id="amount"
            min="1"
            placeholder="जैसे 500"
        >

        <button id="registerBtn">
            📝 Register
        </button>

        <button
            class="back"
            onclick="location.href='index.html'"
        >
            ← Back
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey: "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
        "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
        "masjid-e-ayesha-371f6",

    storageBucket:
        "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
        "356807161570",

    appId:
        "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
        "G-Q5TVCP79W2"
};


/* ================================
   INITIALIZE FIREBASE
================================ */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ================================
   REGISTER
================================ */

document
.getElementById("registerBtn")
.addEventListener("click", async function(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const amount =
        document
        .getElementById("amount")
        .value;

    const message =
        document
        .getElementById("message");


    /* VALIDATION */

    if(name === ""){

        message.style.color = "red";

        message.innerHTML =
            "❌ अपना नाम लिखें।";

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        message.style.color = "red";

        message.innerHTML =
            "❌ सही 10 digit mobile number डालें।";

        return;
    }


    if(email === ""){

        message.style.color = "red";

        message.innerHTML =
            "❌ Email डालें।";

        return;
    }


    if(password.length < 6){

        message.style.color = "red";

        message.innerHTML =
            "❌ Password कम से कम 6 characters का होना चाहिए।";

        return;
    }


    if(amount === "" || Number(amount) <= 0){

        message.style.color = "red";

        message.innerHTML =
            "❌ Monthly Hafiji payment amount डालें।";

        return;
    }


    try{

        message.style.color =
            "#0f766e";

        message.innerHTML =
            "⏳ Registration हो रहा है...";


        /* CREATE FIREBASE ACCOUNT */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* SAVE MEMBER PROFILE */

        await setDoc(
            doc(db, "users", user.uid),
            {

                uid: user.uid,

                name: name,

                mobile: mobile,

                email: email,

                role: "member",

                monthlyAmount:
                    Number(amount),

                paymentStatus:
                    "Pending",

                createdAt:
                    new Date().toISOString()

            }
        );


        message.style.color =
            "green";

        message.innerHTML =
            "✅ Registration Successfully हो गया!";


        setTimeout(function(){

            window.location.href =
                "login.html";

        },1500);


    }catch(error){

        console.error(error);

        message.style.color =
            "red";


        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            message.innerHTML =
                "❌ यह Email पहले से Registered है।";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            message.innerHTML =
                "❌ Email सही नहीं है।";

        }

        else if(
            error.code ===
            "auth/weak-password"
        ){

            message.innerHTML =
                "❌ Password कम से कम 6 characters का रखें।";

        }

        else{

            message.innerHTML =
                "❌ Registration Failed: " +
                error.message;

        }

    }

});

</script>

</body>
</html>
