<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Secretary Dashboard - MASJID-E-AYESHA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
}

h2{
    color:#0f766e;
    margin-top:0;
}

.info{
    background:#ecfdf5;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.info p{
    margin:9px 0;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    margin-top:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.refresh{
    background:#2563eb;
}

.delete{
    background:#dc2626;
}

.paid{
    background:#16a34a;
}

.pending{
    background:#f59e0b;
}

.logout{
    background:#555;
}

.member{
    border:1px solid #ddd;
    background:#f8fafc;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.member strong{
    color:#0f766e;
}

.payment{
    border:1px solid #ddd;
    background:#f8fafc;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.statusPaid{
    display:inline-block;
    background:#dcfce7;
    color:#15803d;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
}

.statusPending{
    display:inline-block;
    background:#fef3c7;
    color:#b45309;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
}

.message{
    text-align:center;
    font-weight:bold;
    margin-top:12px;
    line-height:1.5;
}

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.summaryBox{
    background:#ecfdf5;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.summaryBox strong{
    display:block;
    font-size:24px;
    color:#0f766e;
    margin-top:5px;
}

.loading{
    text-align:center;
    color:#666;
    padding:15px;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    word-break:break-word;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}

@media(max-width:450px){

    .summary{
        grid-template-columns:1fr;
    }

    h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🕌 MASJID-E-AYESHA</h1>

<!-- LOGIN -->

<div class="card">

<h2>👤 Secretary Dashboard</h2>

<div class="info">

<p id="loginStatus">
⏳ Login checking...
</p>

<p id="secretaryName">
⏳ Name checking...
</p>

<p id="secretaryRole">
🔐 Role checking...
</p>

</div>

<div id="mainMessage" class="message"></div>

</div>


<!-- SUMMARY -->

<div class="card">

<h2>📊 Payment Summary</h2>

<div class="summary">

<div class="summaryBox">

Hafiji

<strong id="hafijiTotal">
₹0
</strong>

</div>

<div class="summaryBox">

Chanda

<strong id="chandaTotal">
₹0
</strong>

</div>

</div>

</div>


<!-- MEMBERS -->

<div class="card">

<h2>👥 Members</h2>

<button
class="refresh"
id="refreshMembers">

🔄 Members Refresh करें

</button>

<div id="membersMessage"></div>

<div id="membersList">

<div class="loading">
⏳ Members loading...
</div>

</div>

</div>


<!-- PAYMENT STATUS -->

<div class="card">

<h2>💰 Payment Status</h2>

<button
class="refresh"
id="refreshPayments">

🔄 Payment Refresh करें

</button>

<div id="paymentMessage"></div>

<div id="paymentList">

<div class="loading">
⏳ Payment loading...
</div>

</div>

</div>


<!-- PAYMENT HISTORY -->

<div class="card">

<h2>📋 Payment History</h2>

<div id="historyList">

<div class="loading">
⏳ History loading...
</div>

</div>

</div>


<!-- LOGOUT -->

<div class="card">

<button
class="logout"
id="logoutBtn">

🚪 Logout

</button>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    doc,
    deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let currentUserData = null;

let allMembers = [];

let allPayments = [];


/* =====================================================
   ELEMENTS
===================================================== */

const loginStatus =
    document.getElementById("loginStatus");

const secretaryName =
    document.getElementById("secretaryName");

const secretaryRole =
    document.getElementById("secretaryRole");

const mainMessage =
    document.getElementById("mainMessage");

const membersList =
    document.getElementById("membersList");

const membersMessage =
    document.getElementById("membersMessage");

const paymentList =
    document.getElementById("paymentList");

const paymentMessage =
    document.getElementById("paymentMessage");

const historyList =
    document.getElementById("historyList");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(element,text,type){

    element.innerHTML =
        `<div class="${type}">${text}</div>`;

}


/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        console.log("AUTH USER:",user);

        if(!user){

            loginStatus.innerText =
                "❌ Login नहीं है।";

            secretaryName.innerText =
                "👤 कृपया पहले Secretary Login करें।";

            secretaryRole.innerText =
                "🔐 कोई user login नहीं है।";

            /*
              IMPORTANT:
              यहाँ तुरंत signOut नहीं किया गया।
              इससे automatic logout problem नहीं होगी।
            */

            setTimeout(function(){

                location.href =
                    "login.html";

            },1500);

            return;
        }


        currentUser =
            user;


        loginStatus.innerText =
            "✅ Login सफल है";


        try{

            /*
             * users/{uid}
             */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(userRef);


            console.log(
                "USER DOCUMENT EXISTS:",
                userSnap.exists()
            );


            if(userSnap.exists()){

                currentUserData =
                    userSnap.data();


                console.log(
                    "USER DATA:",
                    currentUserData
                );


                secretaryName.innerText =
                    "👤 Name: " +
                    (
                        currentUserData.name ||
                        currentUserData.fullName ||
                        user.displayName ||
                        "Secretary"
                    );


                const role =
                    String(
                        currentUserData.role ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                secretaryRole.innerText =
                    "🔐 Role: " +
                    (
                        role ||
                        "role field नहीं मिला"
                    );


                /*
                 * secretary role check
                 */

                if(
                    role === "secretary" ||
                    role === "secretary "
                ){

                    showMessage(
                        mainMessage,
                        "✅ Secretary Dashboard तैयार है।",
                        "success"
                    );

                }else{

                    /*
                     * यहाँ logout नहीं करेंगे।
                     * पहले कारण दिखाएँगे।
                     */

                    showMessage(
                        mainMessage,
                        "⚠️ Firestore में role = '" +
                        (currentUserData.role || "खाली") +
                        "' है। इसे 'secretary' करें।",
                        "error"
                    );

                }

            }else{

                secretaryName.innerText =
                    "👤 User profile नहीं मिला।";

                secretaryRole.innerText =
                    "🔐 users/" +
                    user.uid +
                    " document नहीं मिला।";


                showMessage(
                    mainMessage,
                    "⚠️ Login सफल है लेकिन Firestore में users collection के अंदर आपका UID document नहीं मिला।",
                    "error"
                );

            }


            /*
             * Dashboard data load
             */

            await loadMembers();

            await loadPayments();

        }catch(error){

            console.error(
                "DASHBOARD ERROR:",
                error
            );


            showMessage(
                mainMessage,
                "❌ Dashboard Error: " +
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadMembers(){

    membersList.innerHTML =
        `<div class="loading">⏳ Members loading...</div>`;


    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allMembers = [];


        snap.forEach(function(item){

            const data =
                item.data();


            const role =
                String(
                    data.role || ""
                )
                .trim()
                .toLowerCase();


            /*
             * Secretary और admin को member list से हटाएँ
             */

            if(
                role !== "secretary" &&
                role !== "admin" &&
                role !== "principal" &&
                role !== "teacher"
            ){

                allMembers.push({

                    id:item.id,

                    ...data

                });

            }

        });


        renderMembers();


    }catch(error){

        console.error(
            "MEMBERS ERROR:",
            error
        );


        membersList.innerHTML =
            `<div class="error">
            ❌ Members load नहीं हुए:<br>
            ${error.message}
            </div>`;

    }

}


/* =====================================================
   RENDER MEMBERS
===================================================== */

function renderMembers(){

    if(allMembers.length === 0){

        membersList.innerHTML =
            `<div class="loading">
            कोई Member नहीं मिला।
            </div>`;

        return;
    }


    membersList.innerHTML = "";


    allMembers.forEach(function(member,index){

        const name =
            member.name ||
            member.fullName ||
            member.memberName ||
            "Unknown Member";


        const email =
            member.email ||
            "Email नहीं है";


        const phone =
            member.phone ||
            member.mobile ||
            member.number ||
            "Mobile नहीं है";


        const div =
            document.createElement("div");


        div.className =
            "member";


        div.innerHTML = `

            <p>
            <strong>👤 Member:</strong>
            ${escapeHTML(name)}
            </p>

            <p>
            📧 ${escapeHTML(email)}
            </p>

            <p>
            📱 ${escapeHTML(phone)}
            </p>

            <p>
            🆔 UID:
            <small>${escapeHTML(member.id)}</small>
            </p>

            <button
            class="delete"
            data-id="${member.id}"
            data-name="${escapeHTML(name)}">

            🗑️ Member ID Delete करें

            </button>

        `;


        membersList.appendChild(div);

    });


    /*
     * Delete buttons
     */

    document
    .querySelectorAll(".delete")
    .forEach(function(button){

        button.addEventListener(
            "click",
            async function(){

                const id =
                    button.dataset.id;

                const name =
                    button.dataset.name;


                const confirmDelete =
                    confirm(
                        "क्या आप '" +
                        name +
                        "' का Member ID delete करना चाहते हैं?"
                    );


                if(!confirmDelete){

                    return;
                }


                try{

                    button.disabled =
                        true;

                    button.innerText =
                        "⏳ Delete हो रहा है...";


                    await deleteDoc(
                        doc(
                            db,
                            "users",
                            id
                        )
                    );


                    showMessage(
                        membersMessage,
                        "✅ Member delete हो गया।",
                        "success"
                    );


                    await loadMembers();


                }catch(error){

                    console.error(error);


                    showMessage(
                        membersMessage,
                        "❌ Delete नहीं हुआ: " +
                        error.message,
                        "error"
                    );


                    button.disabled =
                        false;

                    button.innerText =
                        "🗑️ Member ID Delete करें";

                }

            }
        );

    });

}


/* =====================================================
   LOAD PAYMENTS
===================================================== */

async function loadPayments(){

    paymentList.innerHTML =
        `<div class="loading">
        ⏳ Payments loading...
        </div>`;


    historyList.innerHTML =
        `<div class="loading">
        ⏳ History loading...
        </div>`;


    try{

        const snap =
            await getDocs(
                collection(
                    db,
                    "payments"
                )
            );


        allPayments = [];


        snap.forEach(function(item){

            allPayments.push({

                id:item.id,

                ...item.data()

            });

        });


        console.log(
            "PAYMENTS:",
            allPayments
        );


        calculateSummary();

        renderPayments();

        renderHistory();


    }catch(error){

        console.error(
            "PAYMENT ERROR:",
            error
        );


        paymentList.innerHTML =
            `<div class="error">
            ❌ Payments load नहीं हुए:<br>
            ${error.message}
            </div>`;


        historyList.innerHTML =
            `<div class="error">
            ❌ History load नहीं हुई:<br>
            ${error.message}
            </div>`;

    }

}


/* =====================================================
   PAYMENT SUMMARY
===================================================== */

function calculateSummary(){

    let hafiji =
        0;

    let chanda =
        0;


    allPayments.forEach(function(payment){

        const amount =
            Number(
                payment.amount ||
                payment.paymentAmount ||
                0
            );


        const type =
            String(
                payment.type ||
                payment.paymentType ||
                ""
            )
            .trim()
            .toLowerCase();


        const status =
            String(
                payment.status ||
                ""
            )
            .trim()
            .toLowerCase();


        /*
         * केवल paid/received payment को total में गिनें
         */

        if(
            status === "paid" ||
            status === "success" ||
            status === "received" ||
            status === "approved" ||
            payment.status === undefined
        ){

            if(type === "hafiji"){

                hafiji +=
                    amount;

            }


            if(type === "chanda"){

                chanda +=
                    amount;

            }

        }

    });


    document
    .getElementById("hafijiTotal")
    .innerText =
        "₹" +
        hafiji;


    document
    .getElementById("chandaTotal")
    .innerText =
        "₹" +
        chanda;

}


/* =====================================================
   PAYMENT STATUS
===================================================== */

function renderPayments(){

    if(allPayments.length === 0){

        paymentList.innerHTML =
            `<div class="loading">
            कोई payment record नहीं मिला।
            </div>`;

        return;
    }


    paymentList.innerHTML = "";


    /*
     * latest first
     */

    const list =
        [...allPayments].reverse();


    list.forEach(function(payment){

        const memberName =
            payment.memberName ||
            payment.name ||
            payment.userName ||
            "Unknown Member";


        const type =
            payment.type ||
            payment.paymentType ||
            "Payment";


        const amount =
            Number(
                payment.amount ||
                payment.paymentAmount ||
                0
            );


        let status =
            String(
                payment.status ||
                "pending"
            )
            .trim()
            .toLowerCase();


        let statusText =
            "⏳ Pending";

        let statusClass =
            "statusPending";


        if(
            status === "paid" ||
            status === "success" ||
            status === "received" ||
            status === "approved"
        ){

            statusText =
                "✅ Paid";

            statusClass =
                "statusPaid";

        }


        const div =
            document.createElement("div");


        div.className =
            "payment";


        div.innerHTML = `

            <p>
            <strong>👤 Member:</strong>
            ${escapeHTML(memberName)}
            </p>

            <p>
            💰 Type:
            ${escapeHTML(type)}
            </p>

            <p>
            💵 Amount:
            <strong>₹${amount}</strong>
            </p>

            <p>
            Status:
            <span class="${statusClass}">
            ${statusText}
            </span>
            </p>

            <p>
            📱 Mode:
            ${escapeHTML(
                payment.paymentMode ||
                payment.mode ||
                "Unknown"
            )}
            </p>

            <p>
            📝 Remark:
            ${escapeHTML(
                payment.remark ||
                "कोई remark नहीं"
            )}
            </p>

        `;


        paymentList.appendChild(div);

    });

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

    if(allPayments.length === 0){

        historyList.innerHTML =
            `<div class="loading">
            अभी कोई history नहीं है।
            </div>`;

        return;
    }


    historyList.innerHTML = "";


    [...allPayments]
    .reverse()
    .forEach(function(payment){

        const memberName =
            payment.memberName ||
            payment.name ||
            payment.userName ||
            "Unknown";


        const type =
            payment.type ||
            payment.paymentType ||
            "Payment";


        const amount =
            Number(
                payment.amount ||
                payment.paymentAmount ||
                0
            );


        const status =
            payment.status ||
            "Pending";


        const div =
            document.createElement("div");


        div.className =
            "payment";


        div.innerHTML = `

            <p>
            👤 <strong>
            ${escapeHTML(memberName)}
            </strong>
            </p>

            <p>
            💰 ${escapeHTML(type)}
            </p>

            <p>
            💵 ₹${amount}
            </p>

            <p>
            📌 Status:
            ${escapeHTML(status)}
            </p>

            <p>
            📝 ${
                escapeHTML(
                    payment.remark ||
                    "No remark"
                )
            }
            </p>

        `;


        historyList.appendChild(div);

    });

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   REFRESH MEMBERS
===================================================== */

document
.getElementById("refreshMembers")
.addEventListener(
    "click",
    async function(){

        await loadMembers();

    }
);


/* =====================================================
   REFRESH PAYMENTS
===================================================== */

document
.getElementById("refreshPayments")
.addEventListener(
    "click",
    async function(){

        await loadPayments();

    }
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async function(){

        try{

            await signOut(auth);

            location.href =
                "login.html";

        }catch(error){

            alert(
                "Logout error: " +
                error.message
            );

        }

    }
);

</script>

</body>
</html>
