<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hafiji Dashboard - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.header{
    background:#064e3b;
    color:white;
    text-align:center;
    padding:35px 15px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:12px 0 0;
    font-size:22px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:30px 18px;
}

.box{
    background:white;
    border-radius:25px;
    padding:30px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    text-align:center;
}

.loading-box{
    display:block;
}

.dashboard-box{
    display:none;
}

.error-box{
    display:none;
}

.loading{
    font-size:22px;
    color:#0f766e;
    padding:30px 10px;
}

.success{
    font-size:24px;
    color:#0f766e;
    font-weight:bold;
    margin-bottom:20px;
}

.user-info{
    background:#ecfdf5;
    color:#134e4a;
    border-radius:15px;
    padding:18px;
    margin:20px 0;
    font-size:17px;
    line-height:1.8;
    word-break:break-word;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
    font-size:17px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.logout{
    background:#dc2626;
}

.login{
    background:#0f766e;
}

.message{
    margin-top:20px;
    font-weight:bold;
    font-size:17px;
    line-height:1.6;
}

</style>

</head>

<body>


<div class="header">

    <h1>🕌 MASJID-E-AYESHA</h1>

    <p>📖 Hafiji Sahab Dashboard</p>

</div>



<div class="container">


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        class="box loading-box"
        id="loadingBox"
    >

        <div class="loading">

            ⏳ Login Session Check हो रहा है...

        </div>

    </div>



    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <div
        class="box dashboard-box"
        id="dashboardBox"
    >

        <div class="success">

            ✅ Hafiji Sahab Login Successful

        </div>


        <div class="user-info">

            📖 <b>Hafiji Sahab</b>

            <br><br>

            <b>Email:</b>
            <span id="userEmail">
            </span>

            <br>

            <b>UID:</b>
            <span id="userUID">
            </span>

        </div>


        <button
            class="logout"
            id="logoutBtn"
        >

            🚪 Logout

        </button>


        <div
            class="message"
            id="message"
        ></div>

    </div>



    <!-- =========================================
         ERROR
    ========================================== -->

    <div
        class="box error-box"
        id="errorBox"
    >

        <div
            class="message"
            style="color:red;font-size:22px;"
        >

            ❌ Firebase में Login नहीं मिला।

        </div>


        <button
            class="login"
            id="loginBtn"
        >

            🔐 Login Page पर जाएँ

        </button>

    </div>


</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    browserLocalPersistence,
    setPersistence,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);


/* =====================================================
   HAFIJI EMAIL
===================================================== */

const HAFIJI_EMAIL =
"hafiji2@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loadingBox =
document.getElementById(
    "loadingBox"
);

const dashboardBox =
document.getElementById(
    "dashboardBox"
);

const errorBox =
document.getElementById(
    "errorBox"
);

const userEmail =
document.getElementById(
    "userEmail"
);

const userUID =
document.getElementById(
    "userUID"
);

const logoutBtn =
document.getElementById(
    "logoutBtn"
);

const loginBtn =
document.getElementById(
    "loginBtn"
);

const message =
document.getElementById(
    "message"
);


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(){

    loadingBox.style.display =
    "none";

    dashboardBox.style.display =
    "none";

    errorBox.style.display =
    "block";

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(user){

    loadingBox.style.display =
    "none";

    errorBox.style.display =
    "none";

    dashboardBox.style.display =
    "block";


    userEmail.innerText =
    user.email || "";

    userUID.innerText =
    user.uid || "";


    localStorage.setItem(
        "adminType",
        "hafiji"
    );

    localStorage.setItem(
        "adminUID",
        user.uid
    );

    localStorage.setItem(
        "loginEmail",
        user.email || ""
    );

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    message.innerHTML =
    "🟢 Firebase Login Active है।";

    message.style.color =
    "green";

}


/* =====================================================
   FIREBASE AUTH STATE
===================================================== */

async function checkLogin(){

    try{

        /*
         * LOCAL PERSISTENCE
         */

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        /*
         * Firebase के saved login को
         * restore होने का इंतजार
         */

        await auth.authStateReady();


        const user =
        auth.currentUser;


        console.log(
            "Current Firebase User:",
            user
        );


        /* =============================================
           USER नहीं है
        ============================================= */

        if(!user){

            console.log(
                "Firebase में कोई logged-in user नहीं है।"
            );

            showError();

            return;

        }


        /* =============================================
           EMAIL CHECK
        ============================================= */

        if(
            !user.email ||
            user.email.toLowerCase() !==
            HAFIJI_EMAIL.toLowerCase()
        ){

            console.log(
                "Logged user Hafiji नहीं है:",
                user.email
            );

            showError();

            return;

        }


        /* =============================================
           SUCCESS
        ============================================= */

        console.log(
            "HAFIJI LOGIN VERIFIED"
        );


        showDashboard(user);

    }

    catch(error){

        console.error(
            "AUTH CHECK ERROR:",
            error
        );

        showError();

    }

}


/* =====================================================
   START CHECK
===================================================== */

checkLogin();


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
"click",
async function(){

    try{

        logoutBtn.disabled =
        true;

        logoutBtn.innerText =
        "⏳ Logout हो रहा है...";


        await signOut(auth);


        localStorage.removeItem(
            "adminType"
        );

        localStorage.removeItem(
            "adminUID"
        );

        localStorage.removeItem(
            "loginEmail"
        );

        localStorage.removeItem(
            "isLoggedIn"
        );


        window.location.replace(
            "login.html"
        );

    }

    catch(error){

        console.error(
            "LOGOUT ERROR:",
            error
        );


        logoutBtn.disabled =
        false;

        logoutBtn.innerText =
        "🚪 Logout";


        message.innerHTML =
        "❌ Logout Failed:<br>" +
        error.message;

        message.style.color =
        "red";

    }

});


/* =====================================================
   LOGIN PAGE BUTTON
===================================================== */

loginBtn.addEventListener(
"click",
function(){

    window.location.replace(
        "login.html"
    );

});


</script>

</body>
</html>
