<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}

select,
input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#0f766e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.login-btn{
    background:#0f766e;
}

.forgot{
    background:#f59e0b;
}

.register{
    background:#0f766e;
}

.back{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
    min-height:25px;
}

.info{
    background:#ecfdf5;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:14px;
    color:#134e4a;
    text-align:center;
}

.loading{
    opacity:.7;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🕌
</div>

<h1>
MASJID-E-AYESHA
</h1>


<div class="login-box">

<h2>
🔐 Login
</h2>


<!-- ================= LOGIN TYPE ================= -->

<label>
Login Type
</label>

<select id="loginType">

<option value="member">
👤 Member
</option>

<option value="hafiji">
📖 Hafiji Sahab
</option>

<option value="secretary">
👨‍💼 Secretary Sahab
</option>

</select>


<!-- ================= EMAIL ================= -->

<label id="loginLabel">
Member Email
</label>

<input
type="text"
id="email"
autocomplete="username"
placeholder="Member Email डालें"
>


<!-- ================= PASSWORD ================= -->

<label>
Password
</label>

<input
type="password"
id="password"
autocomplete="current-password"
placeholder="Password डालें"
>


<!-- ================= LOGIN ================= -->

<button
class="login-btn"
id="loginBtn"
>
🔐 Login
</button>


<!-- ================= FORGOT ================= -->

<button
class="forgot"
id="forgotBtn"
>
🔑 Forgot Password
</button>


<!-- ================= REGISTER ================= -->

<button
class="register"
id="registerBtn"
>
📝 New Member Registration
</button>


<!-- ================= BACK ================= -->

<button
class="back"
id="backBtn"
>
← Back
</button>


<!-- ================= MESSAGE ================= -->

<div
id="message"
class="message">
</div>


<div class="info">

🔒 आपका Login Firebase Authentication से सुरक्षित है।

</div>

</div>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   IMPORTANT ACCOUNTS

   Firebase Authentication में यही email होना चाहिए।
===================================================== */

const HAFIJI_EMAIL =
"hafiji2@gmail.com";

const SECRETARY_EMAIL =
"secretary@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loginType =
document.getElementById(
    "loginType"
);

const emailInput =
document.getElementById(
    "email"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginLabel =
document.getElementById(
    "loginLabel"
);

const loginBtn =
document.getElementById(
    "loginBtn"
);

const forgotBtn =
document.getElementById(
    "forgotBtn"
);

const registerBtn =
document.getElementById(
    "registerBtn"
);

const backBtn =
document.getElementById(
    "backBtn"
);

const message =
document.getElementById(
    "message"
);


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(
    text,
    color
){

    message.style.color =
    color;

    message.innerHTML =
    text;

}


/* =====================================================
   LOGIN TYPE CHANGE
===================================================== */

loginType.addEventListener(
"change",
function(){

    const type =
    loginType.value;


    if(type === "member"){

        loginLabel.innerText =
        "Member Email";

        emailInput.placeholder =
        "Member Email डालें";

    }


    else if(type === "hafiji"){

        loginLabel.innerText =
        "Hafiji User ID / Email";

        emailInput.placeholder =
        "hafiji या Email डालें";

    }


    else if(type === "secretary"){

        loginLabel.innerText =
        "Secretary User ID / Email";

        emailInput.placeholder =
        "secretary या Email डालें";

    }


    emailInput.value =
    "";

    passwordInput.value =
    "";

    showMessage(
        "",
        "#0f766e"
    );

});


/* =====================================================
   CONVERT USER ID TO EMAIL
===================================================== */

function getLoginEmail(
    type,
    value
){

    let v =
    value
    .trim()
    .toLowerCase();


    /* HAFIJI */

    if(type === "hafiji"){

        if(
            v === "hafiji" ||
            v === "hafiji sahab"
        ){

            return HAFIJI_EMAIL;

        }

        return v;

    }


    /* SECRETARY */

    if(type === "secretary"){

        if(
            v === "secretary" ||
            v === "secretary sahab"
        ){

            return SECRETARY_EMAIL;

        }

        return v;

    }


    /* MEMBER */

    return v;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

loginBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;


    const enteredEmail =
    emailInput.value.trim();


    const password =
    passwordInput.value;


    /* EMPTY CHECK */

    if(
        enteredEmail === "" ||
        password === ""
    ){

        showMessage(
            "❌ Email / User ID और Password डालें।",
            "red"
        );

        return;

    }


    const email =
    getLoginEmail(
        type,
        enteredEmail
    );


    /* BUTTON DISABLE */

    loginBtn.disabled =
    true;

    loginBtn.classList.add(
        "loading"
    );


    showMessage(
        "⏳ Login हो रहा है...",
        "#0f766e"
    );


    try{

        /* =========================================
           FIREBASE AUTH LOGIN
        ========================================= */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        console.log(
            "Firebase Login Successful"
        );

        console.log(
            "UID:",
            user.uid
        );

        console.log(
            "Email:",
            user.email
        );


        /* =========================================
           HAFIJI
        ========================================= */

        if(type === "hafiji"){

            /*
             * यहां Firestore role check नहीं है।
             * केवल Firebase Authentication email check होगा।
             */

            if(
                !user.email ||
                user.email.toLowerCase() !==
                HAFIJI_EMAIL.toLowerCase()
            ){

                showMessage(
                    "❌ यह Hafiji account नहीं है।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "hafiji"
            );


            localStorage.setItem(
                "adminUID",
                user.uid
            );


            localStorage.setItem(
                "loginEmail",
                user.email
            );


            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Hafiji Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "hafiji.html"
                    );

                },
                700
            );


            return;

        }


        /* =========================================
           SECRETARY
        ========================================= */

        if(type === "secretary"){

            /*
             * यहां भी Firestore role check नहीं है।
             */

            if(
                !user.email ||
                user.email.toLowerCase() !==
                SECRETARY_EMAIL.toLowerCase()
            ){

                showMessage(
                    "❌ यह Secretary account नहीं है।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "secretary"
            );


            localStorage.setItem(
                "adminUID",
                user.uid
            );


            localStorage.setItem(
                "loginEmail",
                user.email
            );


            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Secretary Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "secretary.html"
                    );

                },
                700
            );


            return;

        }


        /* =========================================
           MEMBER
        ========================================= */

        if(type === "member"){

            try{

                const userDoc =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


                if(!userDoc.exists()){

                    showMessage(
                        "❌ Member profile नहीं मिला।",
                        "red"
                    );

                    return;

                }


                const data =
                userDoc.data();


                if(
                    data.role !==
                    "member"
                ){

                    showMessage(
                        "❌ यह Member account नहीं है।",
                        "red"
                    );

                    return;

                }


                localStorage.setItem(
                    "currentUser",
                    user.uid
                );


                localStorage.setItem(
                    "loginEmail",
                    user.email || ""
                );


                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                showMessage(
                    "✅ Member Login Successful<br>⏳ Dashboard खुल रहा है...",
                    "green"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            "member.html"
                        );

                    },
                    700
                );


                return;

            }

            catch(memberError){

                console.error(
                    memberError
                );


                showMessage(
                    "❌ Member profile check नहीं हुआ: " +
                    memberError.message,
                    "red"
                );

                return;

            }

        }


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            showMessage(
                "❌ Email / User ID या Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            showMessage(
                "❌ Firebase में यह account नहीं मिला।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            showMessage(
                "❌ Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            showMessage(
                "❌ Email format गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            showMessage(
                "❌ बहुत ज्यादा कोशिश हुई है। थोड़ी देर बाद फिर प्रयास करें।",
                "red"
            );

        }

        else{

            showMessage(
                "❌ Login Failed:<br>" +
                error.message,
                "red"
            );

        }

    }

    finally{

        loginBtn.disabled =
        false;

        loginBtn.classList.remove(
            "loading"
        );

    }

});


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;


    const enteredEmail =
    emailInput.value.trim();


    if(
        enteredEmail === ""
    ){

        showMessage(
            "❌ पहले Email / User ID डालें।",
            "red"
        );

        return;

    }


    const email =
    getLoginEmail(
        type,
        enteredEmail
    );


    try{

        showMessage(
            "⏳ Password reset link भेजा जा रहा है...",
            "#0f766e"
        );


        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "✅ Password reset link आपके email पर भेज दिया गया है।",
            "green"
        );

    }

    catch(error){

        console.error(
            error
        );


        if(
            error.code ===
            "auth/user-not-found"
        ){

            showMessage(
                "❌ यह email Firebase में नहीं मिला।",
                "red"
            );

        }

        else{

            showMessage(
                "❌ Reset Failed:<br>" +
                error.message,
                "red"
            );

        }

    }

});


/* =====================================================
   REGISTER BUTTON
===================================================== */

registerBtn.addEventListener(
"click",
function(){

    window.location.href =
    "register.html";

});


/* =====================================================
   BACK BUTTON
===================================================== */

backBtn.addEventListener(
"click",
function(){

    window.location.href =
    "index.html";

});


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

passwordInput.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Enter"
    ){

        loginBtn.click();

    }

});


emailInput.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Enter"
    ){

        passwordInput.focus();

    }

});


/* =====================================================
   PAGE READY
===================================================== */

console.log(
    "MASJID-E-AYESHA Login Ready"
);

</script>

</body>
</html>
