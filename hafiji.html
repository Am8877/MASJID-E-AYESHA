body{

.container{

.green{background:#16a34a}
.blue{background:#2563eb}
.orange{background:#f59e0b}
.red{background:#dc2626}
.gray{background:#555}

.message{
    text-align:center;

    margin-top:12px;
    line-height:1.5;
}

.summary{
    display:grid;

.summaryBox{

    padding:15px;
    border-radius:12px;

}

.summaryBox strong{

    color:#0f766e;

.member{

    margin-top:12px;
}

.payment{
    background:#f8fafc;
    border:1px solid #ddd;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
    line-height:1.7;
}

.pending{
    color:#d97706;
    font-weight:bold;
}

.success{
    color:#16a34a;
    font-weight:bold;
}

.small{
    font-size:13px;
    color:#666;
    word-break:break-all;
}

.hidden{
    display:none !important;
}

.empty{
    text-align:center;
    padding:15px;
    color:#666;
}

@media(max-width:450px){
    .summary{
        grid-template-columns:1fr;
    }
}

onAuthStateChanged(

async function(user){

    if(!user){

        authMessage.style.color="red";

        authMessage.innerText =
        "❌ Login नहीं मिला। Login page पर जा रहे हैं...";

/* =====================================================
LOAD MEMBERS
===================================================== */

async function loadMembers(){

    membersList.innerHTML =
    "⏳ Members Loading...";

    memberSelect.innerHTML =
    "<option value=''>⏳ Members Loading...</option>";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


        members = [];


        snapshot.forEach(function(item){

            const data =
            item.data();


            if(
                data.role === "member"
            ){

                members.push({

                    id:item.id,

                    name:
                    data.name ||
                    data.fullName ||
                    data.memberName ||
                    "Member",

                    email:
                    data.email ||
                    "",

                    mobile:
                    data.mobile ||
                    data.phone ||
                    ""

                });

            }

        });


        /* MEMBER SELECT */

        memberSelect.innerHTML =
        "<option value=''>👤 Member Select करें</option>";


        members.forEach(function(member){

            const option =
            document.createElement(
                "option"
            );

            option.value =
            member.id;

            option.textContent =
            member.name +
            (
                member.email
                ? " - " + member.email
                : ""
            );

            memberSelect.appendChild(
                option
            );

        });


        /* MEMBER LIST */

        if(members.length === 0){

            membersList.innerHTML =
            "<div class='empty'>❌ कोई Member नहीं मिला।</div>";

        }

        else{

            membersList.innerHTML = "";

            members.forEach(function(member){

                const div =
                document.createElement(
                    "div"
                );

                div.className =
                "member";


                div.innerHTML =

                "<b>👤 " +
                escapeHTML(member.name) +
                "</b>" +

                "<br>📧 " +
                escapeHTML(member.email) +

                (
                    member.mobile
                    ?
                    "<br>📱 " +
                    escapeHTML(member.mobile)
                    :
                    ""
                ) +

                "<br><span class='small'>UID: " +
                escapeHTML(member.id) +
                "</span>";


                membersList.appendChild(
                    div
                );

            });

        }


        document.getElementById(
            "totalMembers"
        ).innerText =
        members.length;


    }

    catch(error){

        console.error(
            "MEMBERS ERROR:",
            error
        );


        membersList.innerHTML =
        "<div class='empty'>❌ Members load नहीं हुए।<br><br>" +
        escapeHTML(error.message) +
        "</div>";

        memberSelect.innerHTML =
        "<option value=''>❌ Members load नहीं हुए</option>";

    }

}


/* =====================================================
LOAD PAYMENTS
===================================================== */

async function loadPayments(){

    paymentHistory.innerHTML =
    "⏳ Payment History Loading...";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "payments"
            )
        );


        payments = [];


        snapshot.forEach(function(item){

            const data =
            item.data();


            payments.push({

                id:item.id,

                ...data

            });

        });


        /* NEWEST FIRST */

        payments.sort(function(a,b){

            const aTime =
            a.createdAt &&
            a.createdAt.toMillis
            ?
            a.createdAt.toMillis()
            :
            0;

            const bTime =
            b.createdAt &&
            b.createdAt.toMillis
            ?
            b.createdAt.toMillis()
            :
            0;

            return bTime - aTime;

        });


        renderPayments();

    }

    catch(error){

        console.error(
            "PAYMENT ERROR:",
            error
        );


        paymentHistory.innerHTML =
        "<div class='empty'>❌ Payment History load नहीं हुई।<br><br>" +
        escapeHTML(error.message) +
        "</div>";

    }

}
