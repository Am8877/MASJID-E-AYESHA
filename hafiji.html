<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

select,
input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

label{
    font-weight:bold;
    display:block;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#0f766e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.6;
}

.forgot{
    background:#f59e0b;
}

.back{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
    word-break:break-word;
}

</style>

</head>


<body>


<div class="container">

<div class="logo">
🕌
</div>

<h1>
MASJID-E-AYESHA
</h1>


<div class="login-box">

<h2>
🔐 Login
</h2>


<label>
Login Type
</label>


<select id="loginType">

<option value="member">
Member
</option>

<option value="hafiji">
Hafiji Sahab
</option>

<option value="secretary">
Secretary Sahab
</option>

</select>


<label id="loginLabel">
Email
</label>


<input
type="text"
id="email"
placeholder="Email डालें"
autocomplete="username"
>


<label>
Password
</label>


<input
type="password"
id="password"
placeholder="Password डालें"
autocomplete="current-password"
>


<button id="loginBtn">
🔐 Login
</button>


<button
class="forgot"
id="forgotBtn"
>
🔑 Forgot Password
</button>


<button
onclick="location.href='register.html'"
>
📝 New Member Registration
</button>


<button
class="back"
onclick="location.href='index.html'"
>
← Back
</button>


<div
id="message"
class="message"
>
</div>


</div>

</div>



<script type="module">


/* =====================================================
   FIREBASE APP
===================================================== */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";



/* =====================================================
   FIREBASE AUTH
===================================================== */

import {

    getAuth,

    signInWithEmailAndPassword,

    sendPasswordResetEmail,

    setPersistence,

    browserLocalPersistence

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



/* =====================================================
   FIRESTORE
===================================================== */

import {

    getFirestore,

    doc,

    getDoc

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOtV2-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};



/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   IMPORTANT
   LOGIN SESSION BROWSER ME SAVE RAHEGI
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "Firebase persistence enabled"
    );

}catch(error){

    console.error(
        "Persistence error:",
        error
    );

}



/* =====================================================
   FIXED LOGIN EMAILS
===================================================== */

const HAFIJI_EMAIL =
    "hafiji2@gmail.com";


const SECRETARY_EMAIL =
    "secretary@gmail.com";



/* =====================================================
   ELEMENTS
===================================================== */

const loginType =
    document.getElementById(
        "loginType"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginLabel =
    document.getElementById(
        "loginLabel"
    );


const message =
    document.getElementById(
        "message"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );



/* =====================================================
   LOGIN TYPE
===================================================== */

loginType.addEventListener(
    "change",
    function(){

        const type =
            loginType.value;


        if(type === "member"){

            loginLabel.innerText =
                "Email";

            emailInput.placeholder =
                "Member Email डालें";

        }


        if(type === "hafiji"){

            loginLabel.innerText =
                "Hafiji User ID / Email";

            emailInput.placeholder =
                "hafiji या Email डालें";

        }


        if(type === "secretary"){

            loginLabel.innerText =
                "Secretary User ID / Email";

            emailInput.placeholder =
                "secretary या Email डालें";

        }

    }
);



/* =====================================================
   GET LOGIN EMAIL
===================================================== */

function getLoginEmail(
    type,
    value
){

    value =
        value.trim().toLowerCase();


    if(type === "hafiji"){

        if(value === "hafiji"){

            return HAFIJI_EMAIL;

        }

    }


    if(type === "secretary"){

        if(value === "secretary"){

            return SECRETARY_EMAIL;

        }

    }


    return value;

}



/* =====================================================
   NORMALIZE ROLE
===================================================== */

function normalizeRole(
    role
){

    return String(
        role || ""
    )
    .trim()
    .toLowerCase();

}



/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
    "click",
    async function(){

        const type =
            loginType.value;


        const enteredEmail =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            enteredEmail === "" ||
            password === ""
        ){

            message.style.color =
                "red";

            message.innerText =
                "❌ Email / User ID और Password डालें।";

            return;

        }


        const email =
            getLoginEmail(
                type,
                enteredEmail
            );


        try{

            loginBtn.disabled =
                true;


            message.style.color =
                "#0f766e";


            message.innerText =
                "⏳ Login हो रहा है...";


            /*
             * Firebase Login
             */

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            console.log(
                "LOGIN SUCCESS:",
                user.uid
            );


            /*
             * Firestore profile
             */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(!userSnap.exists()){

                /*
                 * यहाँ automatic signOut नहीं करेंगे।
                 * इससे पता चलेगा कि असली समस्या क्या है।
                 */

                message.style.color =
                    "red";

                message.innerHTML =
                    "❌ Login हो गया लेकिन Firestore में आपका profile नहीं मिला।<br><br>" +
                    "UID:<br>" +
                    user.uid;


                loginBtn.disabled =
                    false;


                return;

            }


            const data =
                userSnap.data();


            console.log(
                "FIRESTORE DATA:",
                data
            );


            const role =
                normalizeRole(
                    data.role
                );


            console.log(
                "ROLE:",
                role
            );



            /* =================================================
               MEMBER
            ================================================= */

            if(type === "member"){

                if(role !== "member"){

                    message.style.color =
                        "red";

                    message.innerText =
                        "❌ यह Member account नहीं है। Firestore role: " +
                        (data.role || "खाली");

                    loginBtn.disabled =
                        false;

                    return;

                }


                localStorage.setItem(
                    "currentUser",
                    user.uid
                );


                localStorage.setItem(
                    "userRole",
                    "member"
                );


                message.style.color =
                    "green";

                message.innerText =
                    "✅ Member Login Successful";


                setTimeout(
                    function(){

                        location.replace(
                            "member.html"
                        );

                    },
                    500
                );


                return;

            }



            /* =================================================
               HAFIJI
            ================================================= */

            if(type === "hafiji"){

                if(role !== "hafiji"){

                    message.style.color =
                        "red";

                    message.innerText =
                        "❌ यह Hafiji account नहीं है। Firestore role: " +
                        (data.role || "खाली");

                    loginBtn.disabled =
                        false;

                    return;

                }


                localStorage.setItem(
                    "adminType",
                    "hafiji"
                );


                localStorage.setItem(
                    "adminUID",
                    user.uid
                );


                localStorage.setItem(
                    "userRole",
                    "hafiji"
                );


                message.style.color =
                    "green";

                message.innerText =
                    "✅ Hafiji Login Successful";


                setTimeout(
                    function(){

                        location.replace(
                            "hafiji.html"
                        );

                    },
                    500
                );


                return;

            }



            /* =================================================
               SECRETARY
            ================================================= */

            if(type === "secretary"){

                /*
                 * IMPORTANT:
                 * role को lowercase करके check किया जा रहा है।
                 *
                 * secretary
                 * Secretary
                 * SECRETARY
                 * Secretary
                 * सभी चलेंगे।
                 */

                if(role !== "secretary"){

                    message.style.color =
                        "red";


                    message.innerHTML =
                        "❌ यह Secretary account नहीं है।<br><br>" +
                        "Firestore Role: <b>" +
                        (
                            data.role ||
                            "खाली"
                        ) +
                        "</b><br><br>" +
                        "UID:<br>" +
                        user.uid;


                    /*
                     * यहाँ signOut नहीं है।
                     * इसलिए असली role समस्या साफ दिखाई देगी।
                     */

                    loginBtn.disabled =
                        false;


                    return;

                }


                /*
                 * Local storage
                 */

                localStorage.setItem(
                    "adminType",
                    "secretary"
                );


                localStorage.setItem(
                    "adminUID",
                    user.uid
                );


                localStorage.setItem(
                    "userRole",
                    "secretary"
                );


                localStorage.setItem(
                    "secretaryLoggedIn",
                    "true"
                );


                message.style.color =
                    "green";


                message.innerText =
                    "✅ Secretary Login Successful";


                /*
                 * छोटा delay देकर dashboard
                 */

                setTimeout(
                    function(){

                        location.replace(
                            "secretary.html"
                        );

                    },
                    500
                );


                return;

            }


        }

        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            message.style.color =
                "red";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message.innerText =
                    "❌ Email / User ID या Password गलत है।";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message.innerText =
                    "❌ Account नहीं मिला।";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                message.innerText =
                    "❌ Password गलत है।";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message.innerText =
                    "❌ बहुत ज्यादा कोशिश हो गई। थोड़ी देर बाद फिर कोशिश करें।";

            }

            else{

                message.innerHTML =
                    "❌ Login Error:<br>" +
                    error.message;

            }


            loginBtn.disabled =
                false;

        }

    }
);



/* =====================================================
   FORGOT PASSWORD
===================================================== */

document
.getElementById(
    "forgotBtn"
)
.addEventListener(
    "click",
    async function(){

        const type =
            loginType.value;


        const enteredEmail =
            emailInput.value.trim();


        if(
            enteredEmail === ""
        ){

            message.style.color =
                "red";

            message.innerText =
                "❌ पहले Email / User ID डालें।";

            return;

        }


        const email =
            getLoginEmail(
                type,
                enteredEmail
            );


        try{

            message.style.color =
                "#0f766e";

            message.innerText =
                "⏳ Reset link भेजा जा रहा है...";


            await sendPasswordResetEmail(
                auth,
                email
            );


            message.style.color =
                "green";

            message.innerText =
                "✅ Password reset link आपके email पर भेज दिया गया है।";

        }

        catch(error){

            console.error(
                error
            );


            message.style.color =
                "red";


            if(
                error.code ===
                "auth/user-not-found"
            ){

                message.innerText =
                    "❌ यह email Firebase में नहीं मिला।";

            }

            else{

                message.innerText =
                    "❌ Reset Failed: " +
                    error.message;

            }

        }

    }
);

</script>

</body>

</html>
