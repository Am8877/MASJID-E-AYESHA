<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hafiji Dashboard - MASJID-E-AYESHA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.header{
    background:#064e3b;
    color:white;
    text-align:center;
    padding:35px 12px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:12px 0 0;
    font-size:22px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:35px 18px;
}

.box{
    background:white;
    border-radius:25px;
    padding:32px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    text-align:center;
}

.loading-box{
    display:block;
}

.dashboard-box{
    display:none;
}

.error-box{
    display:none;
}

.loading{
    font-size:22px;
    color:#0f766e;
    padding:35px 10px;
    font-weight:bold;
}

.success{
    font-size:26px;
    color:#0f766e;
    font-weight:bold;
    margin-bottom:25px;
}

.user-info{
    background:#ecfdf5;
    color:#134e4a;
    border-radius:18px;
    padding:22px 15px;
    margin:20px 0;
    font-size:18px;
    line-height:2;
    word-break:break-word;
}

.user-info b{
    font-weight:bold;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:17px;
    margin-top:12px;
    font-size:19px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

button:disabled{
    opacity:.7;
}

.logout{
    background:#dc2626;
}

.login{
    background:#0f766e;
}

.message{
    margin-top:22px;
    font-weight:bold;
    font-size:18px;
    line-height:1.6;
}

.status{
    margin-top:25px;
    font-size:19px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<div class="header">

    <h1>🕌 MASJID-E-AYESHA</h1>

    <p>📖 Hafiji Sahab Dashboard</p>

</div>


<div class="container">

    <!-- LOADING -->

    <div class="box loading-box" id="loadingBox">

        <div class="loading">

            ⏳ Firebase Login Session Check हो रहा है...

        </div>

    </div>


    <!-- DASHBOARD -->

    <div class="box dashboard-box" id="dashboardBox">

        <div class="success">

            ✅ Hafiji Sahab Login Successful

        </div>


        <div class="user-info">

            📖 <b>Hafiji Sahab</b>

            <br><br>

            <b>Email:</b>
            <span id="userEmail"></span>

            <br>

            <b>UID:</b>
            <span id="userUID"></span>

        </div>


        <button
            class="logout"
            id="logoutBtn">

            🚪 Logout

        </button>


        <div
            class="status"
            id="status">

            🟢 Firebase Login Active है।

        </div>

    </div>


    <!-- ERROR -->

    <div class="box error-box" id="errorBox">

        <div
            class="message"
            style="color:red;font-size:22px;">

            ❌ Hafiji Sahab का Firebase Login नहीं मिला।

        </div>


        <button
            class="login"
            id="loginBtn">

            🔐 Login Page पर जाएँ

        </button>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* =====================================================
   HAFIJI EMAIL
===================================================== */

const HAFIJI_EMAIL = "hafiji2@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loadingBox =
document.getElementById("loadingBox");

const dashboardBox =
document.getElementById("dashboardBox");

const errorBox =
document.getElementById("errorBox");

const userEmail =
document.getElementById("userEmail");

const userUID =
document.getElementById("userUID");

const logoutBtn =
document.getElementById("logoutBtn");

const loginBtn =
document.getElementById("loginBtn");

const status =
document.getElementById("status");


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(){

    loadingBox.style.display = "block";

    dashboardBox.style.display = "none";

    errorBox.style.display = "none";

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(user){

    loadingBox.style.display = "none";

    errorBox.style.display = "none";

    dashboardBox.style.display = "block";


    userEmail.textContent =
        user.email || "";

    userUID.textContent =
        user.uid || "";


    /*
       Local information सिर्फ UI के लिए।
       Login Firebase से ही माना जाएगा।
    */

    localStorage.setItem(
        "adminType",
        "hafiji"
    );

    localStorage.setItem(
        "adminUID",
        user.uid
    );

    localStorage.setItem(
        "loginEmail",
        user.email || ""
    );

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    status.textContent =
        "🟢 Firebase Login Active है।";

    status.style.color =
        "green";

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(){

    loadingBox.style.display = "none";

    dashboardBox.style.display = "none";

    errorBox.style.display = "block";

}


/* =====================================================
   FIREBASE AUTH STATE
===================================================== */

/*
   यह सबसे महत्वपूर्ण हिस्सा है।

   Firebase खुद check करेगा कि user
   पहले से login है या नहीं।

   Page refresh करने पर भी Firebase
   saved authentication session को restore
   करेगा।
*/

onAuthStateChanged(
    auth,
    function(user){

        console.log(
            "Firebase Auth State:",
            user
        );


        /*
           User login नहीं है
        */

        if(!user){

            localStorage.removeItem(
                "adminType"
            );

            localStorage.removeItem(
                "adminUID"
            );

            localStorage.removeItem(
                "loginEmail"
            );

            localStorage.removeItem(
                "isLoggedIn"
            );

            showError();

            return;
        }


        /*
           Email check
        */

        if(
            !user.email ||
            user.email.toLowerCase() !==
            HAFIJI_EMAIL.toLowerCase()
        ){

            console.log(
                "यह Hafiji account नहीं है:",
                user.email
            );

            showError();

            return;
        }


        /*
           Hafiji verified
        */

        console.log(
            "HAFIJI LOGIN VERIFIED"
        );

        showDashboard(user);

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            logoutBtn.disabled = true;

            logoutBtn.textContent =
                "⏳ Logout हो रहा है...";


            /*
               केवल इसी button से Firebase logout होगा
            */

            await signOut(auth);


            /*
               Local data भी साफ
            */

            localStorage.removeItem(
                "adminType"
            );

            localStorage.removeItem(
                "adminUID"
            );

            localStorage.removeItem(
                "loginEmail"
            );

            localStorage.removeItem(
                "isLoggedIn"
            );


            /*
               Login page
            */

            window.location.replace(
                "login.html"
            );

        }

        catch(error){

            console.error(
                "Logout Error:",
                error
            );


            logoutBtn.disabled = false;

            logoutBtn.textContent =
                "🚪 Logout";


            status.textContent =
                "❌ Logout Failed: " +
                error.message;

            status.style.color =
                "red";

        }

    }
);


/* =====================================================
   LOGIN PAGE
===================================================== */

loginBtn.addEventListener(
    "click",
    function(){

        window.location.replace(
            "login.html"
        );

    }
);

</script>

</body>
</html>
