<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}

select,
input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    background:#0f766e;
}

.forgot{
    background:#f59e0b;
}

.register{
    background:#0f766e;
}

.back{
    background:#555;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
    min-height:25px;
}

.info{
    background:#ecfdf5;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:14px;
    color:#134e4a;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🕌</div>

<h1>MASJID-E-AYESHA</h1>

<div class="login-box">

<h2>🔐 Login</h2>

<label>Login Type</label>

<select id="loginType">

<option value="member">👤 Member</option>

<option value="hafiji">📖 Hafiji Sahab</option>

<option value="secretary">👨‍💼 Secretary Sahab</option>

</select>


<label id="loginLabel">
Member Email
</label>

<input
type="email"
id="email"
autocomplete="username"
placeholder="Member Email डालें"
>


<label>Password</label>

<input
type="password"
id="password"
autocomplete="current-password"
placeholder="Password डालें"
>


<button
class="login-btn"
id="loginBtn"
>
🔐 Login
</button>


<button
class="forgot"
id="forgotBtn"
>
🔑 Forgot Password
</button>


<button
class="register"
id="registerBtn"
>
📝 New Member Registration
</button>


<button
class="back"
id="backBtn"
>
← Back
</button>


<div
id="message"
class="message">
</div>


<div class="info">
🔒 आपका Login Firebase Authentication से सुरक्षित है।
</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   IMPORTANT ACCOUNTS
===================================================== */

const HAFIJI_EMAIL =
"hafiji2@gmail.com";

const SECRETARY_EMAIL =
"secretary@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loginType =
document.getElementById("loginType");

const loginLabel =
document.getElementById("loginLabel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const registerBtn =
document.getElementById("registerBtn");

const backBtn =
document.getElementById("backBtn");

const message =
document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,color){

    message.innerHTML = text;
    message.style.color = color;

}


/* =====================================================
   LOGIN TYPE
===================================================== */

loginType.addEventListener(
"change",
function(){

    const type =
    loginType.value;


    emailInput.value = "";
    passwordInput.value = "";


    if(type === "member"){

        loginLabel.innerText =
        "Member Email";

        emailInput.type =
        "email";

        emailInput.placeholder =
        "Member Email डालें";

        registerBtn.style.display =
        "block";

    }


    else if(type === "hafiji"){

        loginLabel.innerText =
        "Hafiji Email";

        emailInput.type =
        "email";

        emailInput.placeholder =
        "hafiji2@gmail.com";

        registerBtn.style.display =
        "none";

    }


    else if(type === "secretary"){

        loginLabel.innerText =
        "Secretary Email";

        emailInput.type =
        "email";

        emailInput.placeholder =
        "secretary@gmail.com";

        registerBtn.style.display =
        "none";

    }


    showMessage("","#0f766e");

});


/* =====================================================
   GET LOGIN EMAIL
===================================================== */

function getLoginEmail(type,value){

    const v =
    value.trim().toLowerCase();


    if(type === "hafiji"){

        if(
            v === "hafiji" ||
            v === "hafiji sahab"
        ){

            return HAFIJI_EMAIL;

        }

    }


    if(type === "secretary"){

        if(
            v === "secretary" ||
            v === "secretary sahab"
        ){

            return SECRETARY_EMAIL;

        }

    }


    return v;

}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;

    const enteredEmail =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(
        enteredEmail === "" ||
        password === ""
    ){

        showMessage(
            "❌ Email और Password डालें।",
            "red"
        );

        return;

    }


    const email =
    getLoginEmail(
        type,
        enteredEmail
    );


    loginBtn.disabled =
    true;

    showMessage(
        "⏳ Login हो रहा है...",
        "#0f766e"
    );


    try{

        /* =============================================
           VERY IMPORTANT:
           LOGIN PERSISTENCE
        ============================================= */

        await setPersistence(
            auth,
            browserLocalPersistence
        );


        /* =============================================
           FIREBASE LOGIN
        ============================================= */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        console.log(
            "LOGIN SUCCESS:",
            user.email
        );

        console.log(
            "UID:",
            user.uid
        );


        /* =============================================
           HAFIJI
        ============================================= */

        if(type === "hafiji"){

            if(
                !user.email ||
                user.email.toLowerCase() !==
                HAFIJI_EMAIL.toLowerCase()
            ){

                await signOut(auth);

                showMessage(
                    "❌ यह Hafiji account नहीं है।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "hafiji"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Hafiji Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            /* थोड़ा समय देकर redirect */

            setTimeout(
            function(){

                window.location.replace(
                    "hafiji.html"
                );

            },
            1000
            );


            return;

        }


        /* =============================================
           SECRETARY
        ============================================= */

        if(type === "secretary"){

            if(
                !user.email ||
                user.email.toLowerCase() !==
                SECRETARY_EMAIL.toLowerCase()
            ){

                await signOut(auth);

                showMessage(
                    "❌ यह Secretary account नहीं है।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "secretary"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Secretary Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
            function(){

                window.location.replace(
                    "secretary.html"
                );

            },
            1000
            );


            return;

        }


        /* =============================================
           MEMBER
        ============================================= */

        if(type === "member"){

            const userDoc =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


            if(!userDoc.exists()){

                await signOut(auth);

                showMessage(
                    "❌ Member profile नहीं मिला।",
                    "red"
                );

                return;

            }


            const data =
            userDoc.data();


            if(data.role !== "member"){

                await signOut(auth);

                showMessage(
                    "❌ यह Member account नहीं है।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "currentUser",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Member Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
            function(){

                window.location.replace(
                    "member.html"
                );

            },
            1000
            );


            return;

        }

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            showMessage(
                "❌ Email या Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            showMessage(
                "❌ Firebase में यह account नहीं मिला।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            showMessage(
                "❌ Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            showMessage(
                "❌ Email format गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            showMessage(
                "❌ बहुत ज्यादा कोशिश हुई है। थोड़ी देर बाद फिर प्रयास करें।",
                "red"
            );

        }

        else{

            showMessage(
                "❌ Login Failed:<br>" +
                error.message,
                "red"
            );

        }

    }

    finally{

        loginBtn.disabled =
        false;

    }

});


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;

    const enteredEmail =
    emailInput.value.trim();


    if(enteredEmail === ""){

        showMessage(
            "❌ पहले Email डालें।",
            "red"
        );

        return;

    }


    const email =
    getLoginEmail(
        type,
        enteredEmail
    );


    try{

        showMessage(
            "⏳ Password reset link भेजा जा रहा है...",
            "#0f766e"
        );


        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "✅ Password reset link आपके email पर भेज दिया गया है।",
            "green"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Reset Failed:<br>" +
            error.message,
            "red"
        );

    }

});


/* =====================================================
   REGISTER
===================================================== */

registerBtn.addEventListener(
"click",
function(){

    window.location.href =
    "register.html";

});


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
"click",
function(){

    window.location.href =
    "index.html";

});


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        loginBtn.click();

    }

});


emailInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        passwordInput.focus();

    }

});


console.log(
    "MASJID-E-AYESHA Login Ready"
);

</script>

</body>
</html>
