<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

select,input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

label{
    font-weight:bold;
    display:block;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#0f766e;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.forgot{
    background:#f59e0b;
}

.back{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🕌</div>

<h1>MASJID-E-AYESHA</h1>

<div class="login-box">

<h2>🔐 Login</h2>

<label>Login Type</label>

<select id="loginType">

    <option value="member">
        Member
    </option>

    <option value="hafiji">
        Hafiji Sahab
    </option>

    <option value="secretary">
        Secretary Sahab
    </option>

</select>


<label id="loginLabel">Email</label>

<input
    type="text"
    id="email"
    placeholder="Email डालें"
>


<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Password डालें"
>


<button id="loginBtn">
    🔐 Login
</button>


<button
    class="forgot"
    id="forgotBtn"
>
    🔑 Forgot Password
</button>


<button onclick="location.href='register.html'">
    📝 New Member Registration
</button>


<button
    class="back"
    onclick="location.href='index.html'"
>
    ← Back
</button>


<div id="message" class="message"></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"
};


/* ================= INITIALIZE ================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   HAFIJI / SECRETARY LOGIN ID SETTINGS

   YAHAN APNE ACTUAL FIREBASE EMAIL DAALNA HAI
===================================================== */

const HAFIJI_EMAIL =
    "hafiji2@gmail.com";

const SECRETARY_EMAIL =
    "secretary@gmail.com";


/* ================= ELEMENTS ================= */

const loginType =
    document.getElementById("loginType");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginLabel =
    document.getElementById("loginLabel");

const message =
    document.getElementById("message");


/* ================= LOGIN TYPE CHANGE ================= */

loginType.addEventListener("change", function(){

    const type = loginType.value;

    if(type === "member"){

        loginLabel.innerHTML =
        "Email";

        emailInput.placeholder =
        "Member Email डालें";

    }

    else if(type === "hafiji"){

        loginLabel.innerHTML =
        "Hafiji User ID / Email";

        emailInput.placeholder =
        "hafiji या Email डालें";

    }

    else if(type === "secretary"){

        loginLabel.innerHTML =
        "Secretary User ID / Email";

        emailInput.placeholder =
        "secretary या Email डालें";

    }

});


/* ================= GET ACTUAL EMAIL ================= */

function getLoginEmail(type,value){

    value =
    value.trim().toLowerCase();


    /* HAFIJI */

    if(type === "hafiji"){

        if(value === "hafiji"){
            return HAFIJI_EMAIL;
        }

        return value;
    }


    /* SECRETARY */

    if(type === "secretary"){

        if(value === "secretary"){
            return SECRETARY_EMAIL;
        }

        return value;
    }


    /* MEMBER */

    return value;
}


/* ================= LOGIN ================= */

document
.getElementById("loginBtn")
.addEventListener("click", async function(){

    const type =
        loginType.value;

    const enteredEmail =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(
        enteredEmail === "" ||
        password === ""
    ){

        message.style.color="red";

        message.innerHTML =
        "❌ Email / User ID और Password डालें।";

        return;
    }


    const email =
        getLoginEmail(
            type,
            enteredEmail
        );


    try{

        message.style.color="#0f766e";

        message.innerHTML =
        "⏳ Login हो रहा है...";


        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        /* ================= MEMBER ================= */

        if(type === "member"){

            const userDoc =
            await getDoc(
                doc(db,"users",user.uid)
            );


            if(!userDoc.exists()){

                await signOut(auth);

                message.style.color="red";

                message.innerHTML =
                "❌ Member profile नहीं मिला।";

                return;
            }


            const data =
            userDoc.data();


            if(data.role !== "member"){

                await signOut(auth);

                message.style.color="red";

                message.innerHTML =
                "❌ यह Member account नहीं है।";

                return;
            }


            localStorage.setItem(
                "currentUser",
                user.uid
            );


            message.style.color="green";

            message.innerHTML =
            "✅ Member Login Successful";


            setTimeout(function(){

                location.href =
                "member.html";

            },1000);

            return;
        }


        /* ================= HAFIJI ================= */

        if(type === "hafiji"){

            const userDoc =
            await getDoc(
                doc(db,"users",user.uid)
            );


            if(
                userDoc.exists() &&
                userDoc.data().role === "hafiji"
            ){

                localStorage.setItem(
                    "adminType",
                    "hafiji"
                );

                localStorage.setItem(
                    "adminUID",
                    user.uid
                );


                message.style.color="green";

                message.innerHTML =
                "✅ Hafiji Login Successful";


                setTimeout(function(){

                    location.href =
                    "hafiji.html";

                },1000);

            }

            else{

                await signOut(auth);

                message.style.color="red";

                message.innerHTML =
                "❌ यह Hafiji account नहीं है।";

            }

            return;
        }


        /* ================= SECRETARY ================= */

        if(type === "secretary"){

            const userDoc =
            await getDoc(
                doc(db,"users",user.uid)
            );


            if(
                userDoc.exists() &&
                userDoc.data().role === "secretary"
            ){

                localStorage.setItem(
                    "adminType",
                    "secretary"
                );

                localStorage.setItem(
                    "adminUID",
                    user.uid
                );


                message.style.color="green";

                message.innerHTML =
                "✅ Secretary Login Successful";


                setTimeout(function(){

                    location.href =
                    "secretary.html";

                },1000);

            }

            else{

                await signOut(auth);

                message.style.color="red";

                message.innerHTML =
                "❌ यह Secretary account नहीं है।";

            }

        }


    }

    catch(error){

        console.error(error);

        message.style.color="red";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message.innerHTML =
            "❌ Email / User ID या Password गलत है।";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            message.innerHTML =
            "❌ Account नहीं मिला।";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            message.innerHTML =
            "❌ Password गलत है।";

        }

        else{

            message.innerHTML =
            "❌ Login Failed: " +
            error.message;

        }

    }

});


/* ================= FORGOT PASSWORD ================= */

document
.getElementById("forgotBtn")
.addEventListener("click", async function(){

    const type =
        loginType.value;

    const enteredEmail =
        emailInput.value.trim();


    if(enteredEmail === ""){

        message.style.color="red";

        message.innerHTML =
        "❌ पहले Email / User ID डालें।";

        return;
    }


    const email =
        getLoginEmail(
            type,
            enteredEmail
        );


    try{

        message.style.color="#0f766e";

        message.innerHTML =
        "⏳ Reset link भेजा जा रहा है...";


        await sendPasswordResetEmail(
            auth,
            email
        );


        message.style.color="green";

        message.innerHTML =
        "✅ Password reset link आपके email पर भेज दिया गया है।";


    }

    catch(error){

        console.error(error);

        message.style.color="red";


        if(
            error.code ===
            "auth/user-not-found"
        ){

            message.innerHTML =
            "❌ यह email Firebase में नहीं मिला।";

        }

        else{

            message.innerHTML =
            "❌ Reset Failed: " +
            error.message;

        }

    }

});

</script>

</body>
</html>
