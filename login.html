<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}

select,
input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#0f766e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.forgot{
    background:#f59e0b;
}

.register{
    background:#0f766e;
}

.back{
    background:#555;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
    min-height:25px;
}

.info{
    background:#ecfdf5;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:14px;
    color:#134e4a;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🕌
</div>

<h1>
MASJID-E-AYESHA
</h1>

<div class="login-box">

<h2>
🔐 Login
</h2>

<label>
Login Type
</label>

<select id="loginType">

<option value="member">
👤 Member
</option>

<option value="hafiji">
📖 Hafiji Sahab
</option>

<option value="secretary">
👨‍💼 Secretary Sahab
</option>

</select>


<label id="loginLabel">
Member Email
</label>

<input
type="email"
id="email"
autocomplete="username"
placeholder="Member Email डालें"
>


<label>
Password
</label>

<input
type="password"
id="password"
autocomplete="current-password"
placeholder="Password डालें"
>


<button id="loginBtn">
🔐 Login
</button>


<button
class="forgot"
id="forgotBtn"
>
🔑 Forgot Password
</button>


<button
class="register"
id="registerBtn"
>
📝 New Member Registration
</button>


<button
class="back"
id="backBtn"
>
← Back
</button>


<div
id="message"
class="message">
</div>


<div class="info">
🔒 आपका Login Firebase Authentication से सुरक्षित है।
</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginType =
document.getElementById("loginType");

const loginLabel =
document.getElementById("loginLabel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const registerBtn =
document.getElementById("registerBtn");

const backBtn =
document.getElementById("backBtn");

const message =
document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,color){

    message.style.color = color;

    message.innerHTML = text;

}


/* =====================================================
   LOGIN TYPE CHANGE
===================================================== */

loginType.addEventListener(
"change",
function(){

    const type =
    loginType.value;


    emailInput.value = "";

    passwordInput.value = "";


    if(type === "member"){

        loginLabel.innerText =
        "Member Email";

        emailInput.placeholder =
        "Member Email डालें";

        emailInput.type =
        "email";

    }


    else if(type === "hafiji"){

        loginLabel.innerText =
        "Hafiji Email";

        emailInput.placeholder =
        "Hafiji Firebase Email डालें";

        emailInput.type =
        "email";

    }


    else if(type === "secretary"){

        loginLabel.innerText =
        "Secretary Email";

        emailInput.placeholder =
        "Secretary Firebase Email डालें";

        emailInput.type =
        "email";

    }


    showMessage(
        "",
        "#0f766e"
    );

});


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;

    const email =
    emailInput.value
    .trim()
    .toLowerCase();

    const password =
    passwordInput.value;


    if(
        email === "" ||
        password === ""
    ){

        showMessage(
            "❌ Email और Password दोनों डालें।",
            "red"
        );

        return;

    }


    loginBtn.disabled = true;

    loginBtn.innerText =
    "⏳ Login हो रहा है...";


    showMessage(
        "⏳ Firebase Login हो रहा है...",
        "#0f766e"
    );


    try{

        /* =============================================
           FIREBASE AUTH
        ============================================= */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        console.log(
            "LOGIN SUCCESS"
        );

        console.log(
            "UID:",
            user.uid
        );

        console.log(
            "EMAIL:",
            user.email
        );


        /* =============================================
           GET USER PROFILE
        ============================================= */

        showMessage(
            "⏳ Account role check हो रहा है...",
            "#0f766e"
        );


        const userRef =
        doc(
            db,
            "users",
            user.uid
        );


        const userSnap =
        await getDoc(userRef);


        /* =============================================
           PROFILE NOT FOUND
        ============================================= */

        if(!userSnap.exists()){

            await signOut(auth);

            showMessage(
                "❌ Firebase में इस account का users profile नहीं मिला।<br><br>UID: " +
                user.uid,
                "red"
            );

            return;

        }


        const data =
        userSnap.data();


        const role =
        String(
            data.role || ""
        )
        .toLowerCase()
        .trim();


        console.log(
            "FIRESTORE ROLE:",
            role
        );


        /* =============================================
           MEMBER
        ============================================= */

        if(type === "member"){

            if(role !== "member"){

                await signOut(auth);

                showMessage(
                    "❌ यह Member account नहीं है।<br>Database Role: " +
                    (role || "खाली"),
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "currentUser",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Member Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "member.html"
                    );

                },
                700
            );


            return;

        }


        /* =============================================
           HAFIJI
        ============================================= */

        if(type === "hafiji"){

            if(role !== "hafiji"){

                await signOut(auth);

                showMessage(
                    "❌ यह Hafiji account नहीं है।<br><br>" +
                    "Firebase में इस account का Role: <b>" +
                    (role || "खाली") +
                    "</b><br><br>" +
                    "Hafiji के लिए users document में role = hafiji होना चाहिए।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "hafiji"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Hafiji Login Successful<br>⏳ Hafiji Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "hafiji.html"
                    );

                },
                700
            );


            return;

        }


        /* =============================================
           SECRETARY
        ============================================= */

        if(type === "secretary"){

            if(role !== "secretary"){

                await signOut(auth);

                showMessage(
                    "❌ यह Secretary account नहीं है।<br><br>" +
                    "Firebase में इस account का Role: <b>" +
                    (role || "खाली") +
                    "</b><br><br>" +
                    "Secretary के लिए users document में role = secretary होना चाहिए।",
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "secretary"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Secretary Login Successful<br>⏳ Secretary Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "secretary.html"
                    );

                },
                700
            );


            return;

        }

    }


    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            showMessage(
                "❌ Email या Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            showMessage(
                "❌ Firebase में यह account नहीं मिला।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            showMessage(
                "❌ Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            showMessage(
                "❌ Email सही नहीं है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            showMessage(
                "❌ बहुत ज्यादा login attempts हुए हैं। थोड़ी देर बाद कोशिश करें।",
                "red"
            );

        }

        else if(
            error.code ===
            "permission-denied"
        ){

            showMessage(
                "❌ Firestore Permission Denied.<br><br>" +
                "Firebase Rules में logged-in user को अपने users document को पढ़ने की permission दें।",
                "red"
            );

        }

        else{

            showMessage(
                "❌ Login Failed:<br>" +
                error.message,
                "red"
            );

        }

    }


    finally{

        loginBtn.disabled =
        false;

        loginBtn.innerText =
        "🔐 Login";

    }

});


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotBtn.addEventListener(
"click",
async function(){

    const email =
    emailInput.value
    .trim()
    .toLowerCase();


    if(email === ""){

        showMessage(
            "❌ पहले Email डालें।",
            "red"
        );

        return;

    }


    try{

        showMessage(
            "⏳ Password reset link भेजा जा रहा है...",
            "#0f766e"
        );


        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "✅ Password reset link आपके email पर भेज दिया गया है।",
            "green"
        );

    }

    catch(error){

        console.error(error);


        showMessage(
            "❌ Reset Failed:<br>" +
            error.message,
            "red"
        );

    }

});


/* =====================================================
   REGISTER
===================================================== */

registerBtn.addEventListener(
"click",
function(){

    window.location.href =
    "register.html";

});


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
"click",
function(){

    window.location.href =
    "index.html";

});


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        loginBtn.click();

    }

});


emailInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        passwordInput.focus();

    }

});


console.log(
    "MASJID-E-AYESHA LOGIN READY"
);

</script>

</body>
</html>
