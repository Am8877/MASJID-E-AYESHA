<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MASJID-E-AYESHA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

select,
input{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.login-btn{
    background:#0f766e;
}

.forgot{
    background:#f59e0b;
}

.register{
    background:#0f766e;
}

.back{
    background:#555;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.6;
    min-height:30px;
}

.info{
    margin-top:18px;
    padding:12px;
    background:#ecfdf5;
    color:#134e4a;
    border-radius:10px;
    text-align:center;
    font-size:14px;
}

.debug{
    margin-top:12px;
    padding:10px;
    background:#f8fafc;
    border-radius:10px;
    font-size:12px;
    color:#555;
    word-break:break-all;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🕌</div>

<h1>MASJID-E-AYESHA</h1>

<div class="login-box">

<h2>🔐 Login</h2>


<label>
Login Type
</label>

<select id="loginType">

<option value="member">
👤 Member
</option>

<option value="hafiji">
📖 Hafiji Sahab
</option>

<option value="secretary">
👨‍💼 Secretary Sahab
</option>

</select>


<label id="emailLabel">
Member Email
</label>

<input
    type="email"
    id="email"
    autocomplete="username"
    placeholder="Member Email डालें"
>


<label>
Password
</label>

<input
    type="password"
    id="password"
    autocomplete="current-password"
    placeholder="Password डालें"
>


<button
    class="login-btn"
    id="loginBtn"
>
🔐 Login
</button>


<button
    class="forgot"
    id="forgotBtn"
>
🔑 Forgot Password
</button>


<button
    class="register"
    id="registerBtn"
>
📝 New Member Registration
</button>


<button
    class="back"
    id="backBtn"
>
← Back
</button>


<div
    id="message"
    class="message">
</div>


<div class="info">
🔒 Firebase Authentication Login
</div>


<div
    id="debug"
    class="debug">
स्थिति: Login के लिए तैयार
</div>

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOt2V1-J5rNgj_QqMD_EFbg",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb",

    measurementId:
    "G-Q5TVCP79W2"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =====================================================
   FIXED ADMIN EMAILS
===================================================== */

const HAFIJI_EMAIL =
"hafiji2@gmail.com";

const SECRETARY_EMAIL =
"secretary@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loginType =
document.getElementById("loginType");

const emailLabel =
document.getElementById("emailLabel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const registerBtn =
document.getElementById("registerBtn");

const backBtn =
document.getElementById("backBtn");

const message =
document.getElementById("message");

const debug =
document.getElementById("debug");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,color){

    message.style.color =
    color;

    message.innerHTML =
    text;

}


/* =====================================================
   DEBUG
===================================================== */

function showDebug(text){

    debug.innerText =
    text;

}


/* =====================================================
   LOGIN TYPE CHANGE
===================================================== */

loginType.addEventListener(
"change",
function(){

    const type =
    loginType.value;


    emailInput.value =
    "";

    passwordInput.value =
    "";

    showMessage(
        "",
        "#0f766e"
    );


    if(type === "member"){

        emailLabel.innerText =
        "Member Email";

        emailInput.placeholder =
        "Member Email डालें";

    }


    if(type === "hafiji"){

        emailLabel.innerText =
        "Hafiji Email";

        emailInput.placeholder =
        "hafiji2@gmail.com";

    }


    if(type === "secretary"){

        emailLabel.innerText =
        "Secretary Email";

        emailInput.placeholder =
        "secretary@gmail.com";

    }

});


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
"click",
async function(){

    const type =
    loginType.value;


    const email =
    emailInput.value
    .trim()
    .toLowerCase();


    const password =
    passwordInput.value;


    if(email === ""){

        showMessage(
            "❌ Email डालें।",
            "red"
        );

        return;

    }


    if(password === ""){

        showMessage(
            "❌ Password डालें।",
            "red"
        );

        return;

    }


    loginBtn.disabled =
    true;

    loginBtn.innerText =
    "⏳ Login हो रहा है...";


    showMessage(
        "⏳ Firebase में Login हो रहा है...",
        "#0f766e"
    );


    try{

        /* =============================================
           FIREBASE AUTH
        ============================================= */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        showDebug(
            "Firebase Login OK | UID: " +
            user.uid +
            " | Email: " +
            user.email
        );


        console.log(
            "LOGIN USER:",
            user
        );


        /* =============================================
           HAFIJI
           
           Email match होने पर सीधे Hafiji Dashboard
           खुलेगा।
        ============================================= */

        if(type === "hafiji"){

            if(
                !user.email ||
                user.email.toLowerCase() !==
                HAFIJI_EMAIL.toLowerCase()
            ){

                await signOut(auth);

                showMessage(
                    "❌ यह Hafiji account नहीं है।<br><br>" +
                    "Login Email:<br>" +
                    user.email,
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "hafiji"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Hafiji Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            showDebug(
                "Hafiji Login OK → hafiji.html"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "hafiji.html";

                },
                500
            );


            return;

        }


        /* =============================================
           SECRETARY
           
           Email match होने पर Secretary Dashboard
           खुलेगा।
        ============================================= */

        if(type === "secretary"){

            if(
                !user.email ||
                user.email.toLowerCase() !==
                SECRETARY_EMAIL.toLowerCase()
            ){

                await signOut(auth);

                showMessage(
                    "❌ यह Secretary account नहीं है।<br><br>" +
                    "Login Email:<br>" +
                    user.email,
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "adminType",
                "secretary"
            );

            localStorage.setItem(
                "adminUID",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Secretary Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            showDebug(
                "Secretary Login OK → secretary.html"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "secretary.html";

                },
                500
            );


            return;

        }


        /* =============================================
           MEMBER
        ============================================= */

        if(type === "member"){

            showMessage(
                "⏳ Member profile check हो रहा है...",
                "#0f766e"
            );


            const userRef =
            doc(
                db,
                "users",
                user.uid
            );


            const userSnap =
            await getDoc(
                userRef
            );


            if(!userSnap.exists()){

                await signOut(auth);

                showMessage(
                    "❌ Member profile नहीं मिला।",
                    "red"
                );

                return;

            }


            const data =
            userSnap.data();


            const role =
            String(
                data.role || ""
            )
            .toLowerCase()
            .trim();


            if(role !== "member"){

                await signOut(auth);

                showMessage(
                    "❌ यह Member account नहीं है।<br><br>" +
                    "Database Role: " +
                    (role || "खाली"),
                    "red"
                );

                return;

            }


            localStorage.setItem(
                "currentUser",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            showMessage(
                "✅ Member Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "member.html";

                },
                500
            );


            return;

        }

    }


    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            showMessage(
                "❌ Email या Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            showMessage(
                "❌ Firebase में यह account नहीं मिला।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            showMessage(
                "❌ Password गलत है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            showMessage(
                "❌ Email सही नहीं है।",
                "red"
            );

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            showMessage(
                "❌ बहुत ज्यादा कोशिश हुई है। थोड़ी देर बाद फिर प्रयास करें।",
                "red"
            );

        }

        else if(
            error.code ===
            "permission-denied"
        ){

            showMessage(
                "❌ Firestore Permission Denied।",
                "red"
            );

        }

        else{

            showMessage(
                "❌ Login Failed:<br>" +
                error.message,
                "red"
            );

        }


        showDebug(
            "Error: " +
            error.code
        );

    }


    finally{

        loginBtn.disabled =
        false;

        loginBtn.innerText =
        "🔐 Login";

    }

});


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotBtn.addEventListener(
"click",
async function(){

    const email =
    emailInput.value
    .trim()
    .toLowerCase();


    if(email === ""){

        showMessage(
            "❌ पहले Email डालें।",
            "red"
        );

        return;

    }


    try{

        showMessage(
            "⏳ Reset link भेजा जा रहा है...",
            "#0f766e"
        );


        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "✅ Password reset link email पर भेज दिया गया है।",
            "green"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Reset Failed:<br>" +
            error.message,
            "red"
        );

    }

});


/* =====================================================
   REGISTER
===================================================== */

registerBtn.addEventListener(
"click",
function(){

    window.location.href =
    "register.html";

});


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
"click",
function(){

    window.location.href =
    "index.html";

});


/* =====================================================
   ENTER KEY
===================================================== */

emailInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        passwordInput.focus();

    }

});


passwordInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        loginBtn.click();

    }

});


/* =====================================================
   READY
===================================================== */

console.log(
    "MASJID-E-AYESHA LOGIN READY"
);

</script>

</body>
</html>
