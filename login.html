<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MASJID-E-AYESHA</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#064e3b,#0f766e);
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:60px;
}

h1{
    color:white;
    text-align:center;
    font-size:28px;
    margin:8px 0 20px;
}

.login-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f766e;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

select,input{
    width:100%;
    padding:15px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.login{
    background:#0f766e;
}

.forgot{
    background:#f59e0b;
}

.register{
    background:#0f766e;
}

.back{
    background:#555;
}

button:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
    line-height:1.6;
}

.info{
    margin-top:18px;
    padding:13px;
    border-radius:12px;
    background:#ecfdf5;
    color:#134e4a;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🕌</div>

<h1>MASJID-E-AYESHA</h1>

<div class="login-box">

<h2>🔐 Login</h2>

<label>Login Type</label>

<select id="loginType">

<option value="member">👤 Member</option>

<option value="hafiji">📖 Hafiji Sahab</option>

<option value="secretary">👨‍💼 Secretary Sahab</option>

</select>


<label id="emailLabel">
Member Email
</label>

<input
    type="email"
    id="email"
    autocomplete="username"
    placeholder="Member Email डालें"
>


<label>Password</label>

<input
    type="password"
    id="password"
    autocomplete="current-password"
    placeholder="Password डालें"
>


<button class="login" id="loginBtn">
🔐 Login
</button>


<button class="forgot" id="forgotBtn">
🔑 Forgot Password
</button>


<button class="register" id="registerBtn">
📝 New Member Registration
</button>


<button class="back" id="backBtn">
← Back
</button>


<div id="message" class="message"></div>


<div class="info">
🔒 आपका Login Firebase Authentication से सुरक्षित है।
</div>

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBI9ow2vRoOtOtOtOtOtOtOtOtOtOtOtOt",

    authDomain:
    "masjid-e-ayesha-371f6.firebaseapp.com",

    projectId:
    "masjid-e-ayesha-371f6",

    storageBucket:
    "masjid-e-ayesha-371f6.firebasestorage.app",

    messagingSenderId:
    "356807161570",

    appId:
    "1:356807161570:web:53e439043b8eee8e7d90bb"

};


/*
IMPORTANT:

ऊपर apiKey को Firebase Console →
Project Settings → Your apps →
Web App → SDK setup and configuration
से EXACT copy करें।

अगर आपका अभी वाला login Firebase में login कर रहा है,
तो उसके working config को ही यहाँ रखें।
*/


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ==================================================
   ADMIN EMAIL
================================================== */

const HAFIJI_EMAIL =
"hafiji2@gmail.com";

const SECRETARY_EMAIL =
"secretary@gmail.com";


/* ==================================================
   ELEMENTS
================================================== */

const loginType =
document.getElementById("loginType");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const emailLabel =
document.getElementById("emailLabel");

const loginBtn =
document.getElementById("loginBtn");

const forgotBtn =
document.getElementById("forgotBtn");

const message =
document.getElementById("message");


/* ==================================================
   MESSAGE
================================================== */

function showMessage(text,color){

    message.style.color = color;

    message.innerHTML = text;

}


/* ==================================================
   LOGIN TYPE
================================================== */

loginType.addEventListener("change",function(){

    const type = loginType.value;

    emailInput.value = "";
    passwordInput.value = "";

    if(type === "member"){

        emailLabel.innerText =
        "Member Email";

        emailInput.placeholder =
        "Member Email डालें";

    }

    else if(type === "hafiji"){

        emailLabel.innerText =
        "Hafiji Email";

        emailInput.placeholder =
        "hafiji2@gmail.com";

    }

    else{

        emailLabel.innerText =
        "Secretary Email";

        emailInput.placeholder =
        "secretary@gmail.com";

    }

    showMessage("","#0f766e");

});


/* ==================================================
   LOGIN
================================================== */

loginBtn.addEventListener("click",async function(){

    const type =
    loginType.value;

    const email =
    emailInput.value.trim().toLowerCase();

    const password =
    passwordInput.value;


    if(!email || !password){

        showMessage(
            "❌ Email और Password डालें।",
            "red"
        );

        return;
    }


    loginBtn.disabled = true;

    showMessage(
        "⏳ Login हो रहा है...",
        "#0f766e"
    );


    try{

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        const user =
        result.user;


        console.log(
            "LOGIN SUCCESS:",
            user.uid,
            user.email
        );


        /* ==========================================
           HAFIJI
        ========================================== */

        if(type === "hafiji"){

            if(
                user.email &&
                user.email.toLowerCase() ===
                HAFIJI_EMAIL.toLowerCase()
            ){

                localStorage.setItem(
                    "adminType",
                    "hafiji"
                );

                localStorage.setItem(
                    "adminUID",
                    user.uid
                );

                localStorage.setItem(
                    "loginEmail",
                    user.email
                );


                showMessage(
                    "✅ Hafiji Login Successful<br>⏳ Dashboard खुल रहा है...",
                    "green"
                );


                setTimeout(function(){

                    window.location.href =
                    "hafiji.html";

                },500);


                return;
            }


            /*
             * यहाँ signOut नहीं किया जा रहा।
             * गलत account होने पर केवल error दिखेगा।
             */

            showMessage(
                "❌ यह Hafiji account नहीं है।<br>" +
                "Firebase में Hafiji email: " +
                HAFIJI_EMAIL,
                "red"
            );

            return;
        }


        /* ==========================================
           SECRETARY
        ========================================== */

        if(type === "secretary"){

            if(
                user.email &&
                user.email.toLowerCase() ===
                SECRETARY_EMAIL.toLowerCase()
            ){

                localStorage.setItem(
                    "adminType",
                    "secretary"
                );

                localStorage.setItem(
                    "adminUID",
                    user.uid
                );

                localStorage.setItem(
                    "loginEmail",
                    user.email
                );


                showMessage(
                    "✅ Secretary Login Successful<br>⏳ Dashboard खुल रहा है...",
                    "green"
                );


                setTimeout(function(){

                    window.location.href =
                    "secretary.html";

                },500);


                return;
            }


            showMessage(
                "❌ यह Secretary account नहीं है।",
                "red"
            );

            return;
        }


        /* ==========================================
           MEMBER
        ========================================== */

        if(type === "member"){

            const userDoc =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


            if(!userDoc.exists()){

                showMessage(
                    "❌ Member profile नहीं मिला।",
                    "red"
                );

                return;
            }


            const data =
            userDoc.data();


            if(data.role !== "member"){

                showMessage(
                    "❌ यह Member account नहीं है।",
                    "red"
                );

                return;
            }


            localStorage.setItem(
                "currentUser",
                user.uid
            );

            localStorage.setItem(
                "loginEmail",
                user.email || ""
            );


            showMessage(
                "✅ Member Login Successful<br>⏳ Dashboard खुल रहा है...",
                "green"
            );


            setTimeout(function(){

                window.location.href =
                "member.html";

            },500);

        }

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "❌ Login Failed:<br>" +
            error.message,
            "red"
        );

    }

    finally{

        loginBtn.disabled = false;

    }

});


/* ==================================================
   FORGOT PASSWORD
================================================== */

forgotBtn.addEventListener("click",async function(){

    const email =
    emailInput.value.trim().toLowerCase();


    if(!email){

        showMessage(
            "❌ पहले Email डालें।",
            "red"
        );

        return;
    }


    try{

        showMessage(
            "⏳ Reset link भेजा जा रहा है...",
            "#0f766e"
        );


        await sendPasswordResetEmail(
            auth,
            email
        );


        showMessage(
            "✅ Password reset link भेज दिया गया है।",
            "green"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "❌ Reset Failed:<br>" +
            error.message,
            "red"
        );

    }

});


/* ==================================================
   BUTTONS
================================================== */

document
.getElementById("registerBtn")
.addEventListener("click",function(){

    location.href =
    "register.html";

});


document
.getElementById("backBtn")
.addEventListener("click",function(){

    location.href =
    "index.html";

});


/* ==================================================
   ENTER KEY
================================================== */

passwordInput.addEventListener(
"keydown",
function(e){

    if(e.key === "Enter"){

        loginBtn.click();

    }

});


console.log(
    "MASJID-E-AYESHA LOGIN READY"
);

</script>

</body>
</html>
